[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "bollywood-hal9000"
version = "0.1.0"
description = "Native Linux HAL 9000 console and voice frontend for Hermes Agent"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = { text = "MIT" }
authors = [{ name = "Bit-Loop" }]
dependencies = [
  "PySide6==6.11.1",
  "httpx==0.28.1",
  "websockets==17.0.1",
  "platformdirs==4.11.3",
  "numpy==2.5.2",
  "scipy==1.18.1",
  "sounddevice==0.5.6",
  "huggingface-hub==0.36.2",
  "faster-whisper==1.2.1",
  "sherpa-onnx==1.13.6",
  "pypinyin==0.55.0",
  "sentencepiece==0.2.2",
  "piper-tts==1.7.0",
  "keyring==25.7.0",
]

[project.optional-dependencies]
xtts = [
  "coqui-tts==0.27.5",
  "torch==2.11.0",
  "torchaudio==2.11.0",
  "torchcodec==0.16.0",
  "torchvision==0.26.0",
  "transformers==4.57.6",
]
test = [
  "pytest==9.1.1",
  "pytest-qt==4.5.0",
  "pytest-cov==7.0.0",
]
package = ["build==1.3.0", "pyinstaller==6.16.0"]

[project.scripts]
hal9000 = "hal9000.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hal9000"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
  "integration: requires a live local service",
  "hardware: requires audio or GPU hardware",
  "models: downloads or loads speech model weights",
]

[tool.coverage.run]
branch = true
source = ["hal9000"]
